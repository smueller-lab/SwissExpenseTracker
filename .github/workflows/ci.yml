name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      # The four checks below mirror the former .pre-commit-config.yaml hooks.
      - name: ruff check
        run: poetry run ruff check src tests

      - name: black check
        run: poetry run black --check src tests

      - name: mypy
        run: poetry run mypy --config-file pyproject.toml

      - name: pytest
        # Dummy keys satisfy the skipif guards so the web-search tests run and
        # replay their committed VCR cassettes (real keys are scrubbed from the
        # cassettes; VCR matches on method+URI, so any non-empty value works).
        env:
          OPENAI_API_KEY: dummy
          TAVILY_API_KEY: dummy
          EXA_API_KEY: dummy
          BRAVE_SEARCH_API_KEY: dummy
          SCRAPE_DO_API_KEY: dummy
        run: poetry run pytest tests --ignore=tests/test_claude_chrome --tb=short --cov --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Catches a broken compose file (bad keys, undefined volumes, etc.) without
      # needing a build. Requires .env to exist because docker-compose.yml has env_file.
      - name: Validate docker-compose config
        run: |
          cp .env.example .env
          docker compose config --quiet

      # The default `docker` driver can't export a GHA cache (cache-to below).
      # Buildx switches to the docker-container driver, which supports it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the image so a broken Dockerfile fails CI instead of merging silently.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: swiss-expense-tracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
