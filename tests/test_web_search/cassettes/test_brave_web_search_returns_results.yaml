        wiki  \u203A Migros\"},\"age\":\"3 days ago\",\"extra_snippets\":[\"Thus the
        word connotes prices that are halfway between retail and wholesale, along
        with the business model (medium-scale semi-wholesale). The logo of the company
        is a large orange M. Migros is often referred to as \\\"the orange giant\\\"
        (German: oranger Riese, French: g\xE9ant orange, Italian: gigante arancio).\",\"Migros
        was founded in 1925 in Zurich as a private enterprise by Gottlieb Duttweiler,
        who had the idea of selling just six basic products at low prices to householders
        who, in those days, did not have ready access to markets of any kind. At first
        he sold only coffee, rice, sugar, pasta, coconut oil and soap from five lorries
        that went from one village or hamlet to another.\",\"The strategy to cut the
        intermediate trade and their margins led to the broad resistance of his competitors
        who goaded the producers to boycott him. As a reaction to this threat, Migros
        started creating its own line of goods beginning with meat, milk and chocolate.\",\"By
        1941, the energetic entrepreneur had built a number of markets but, in that
        year, he basically gave the business to his customers by transforming everything
        from his privately owned enterprises into regional cooperatives, headed by
        the Federation of Migros Cooperatives.\",\"As early as 1935, Duttweiler showed
        his zest for expansion by founding the Hotelplan travel agency. In 1942, the
        Migros brand was applied to a weekly magazine, Wir Br\xFCckenbauer (lit. 'We
        Bridgebuilders', now known as Migros Magazine).\"]},{\"title\":\"Migros \u2013
        Einkaufen & Sparen - App Store - Apple\",\"url\":\"https://apps.apple.com/us/app/migros-einkaufen-sparen/id412845300\",\"is_source_local\":false,\"is_source_both\":false,\"description\":\"The
        digital shopping assistant gives you all the advantages of <strong>Migros</strong>
        in the palm of your hand at all times, wherever you are. Find out about the
