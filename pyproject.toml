[tool.poetry]
name = "swiss_exp_tracker"
version = "0.2.0"
description = "Swiss ExpenseTracker tool"
authors = ["Sebastian Müller <sebastian96mueller@gmail.com>"]
readme = "README.md"
license = "GPL-3.0-only"
packages = [{include = "swiss_exp_tracker", from = "src"}, {include = "tests"}]

[tool.poetry.dependencies]
python = ">=3.12"
numpy = "^2.3.1"
pandas = "^2.3.0"
openai = ">=2.26.0,<3"
openai-agents = "^0.12.5"
fuzzywuzzy = "^0.18.0"
python-dotenv = "^1.1.1"
pyarrow = "^20.0.0"
rapidfuzz = "^3.13.0"
plotly = "^6.2.0"
nbformat = "^5.10.4"
dash = "^3.2.0"
scikit-learn = "^1.7.2"
dash-ag-grid = "^32.3.2"
chromadb = "^1.5.5"
xlrd = ">=2.0.1"
aiosql = "^12.0"
pyyaml = "^6.0.3"
statsmodels = "^0.14.6"

[tool.poetry.group.dev.dependencies]
kaleido = "^1.1.0"
ruff = "^0.11.0"
black = "^25.1.0"
mypy = "^1.15.0"
types-tqdm = "^4.67.3.20260408"
pytest = ">=7.0"
pytest-cov = ">=4.0"
pytest-asyncio = ">=0.23"
pytest-mock = ">=3.0"
selenium = ">=4.44.0"
psutil = ">=5.8.0"
multiprocess = ">=0.70.12"
pytest-recording = "^0.13.4"
types-pyyaml = "^6.0.12.20260518"
aiohttp = "^3.14.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
extend-exclude = []
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ERA", # flake8-eradicate/eradicate
    "I",   # isort
    "N",   # pep8-naming
    "PIE", # flake8-pie
    "PGH", # pygrep
    "RUF", # ruff checks
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
]
ignore = [
    "TC003",  # move into type checking block
    "TC001",  # move into type checking block
    "TC002",  # move into type checking block
    "ERA001", # Found commented-out code
    "UP038",  # deprecated: isinstance with Union type
]

[tool.ruff.lint.per-file-ignores]
# Dash app uses PascalCase for DataFrames and callback function names — intentional
"src/swiss_exp_tracker/app/**" = ["N801", "N802", "N803", "N806", "N815", "N816", "N999", "RUF012"]
extend-safe-fixes = [
    "TCH", # move import from and to TYPE_CHECKING blocks
]
unfixable = [
    "ERA", # do not autoremove commented out code
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = true
lines-between-types = 1
lines-after-imports = -1
known-first-party = ["swiss_exp_tracker"]
required-imports = ["from __future__ import annotations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so absolute `tests.*` imports resolve in CI,
# independent of whether the editable install's .pth adds the root.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Integration tests (browser/Chrome-driven Dash tests) are excluded by default
# so the normal suite and CI stay fast and hermetic. Run them manually with:
#   poetry run pytest tests/test_claude_chrome -m integration
addopts = ["-ra", "-q", "--strict-markers", "--strict-config", "-m", "not integration"]
markers = [
    "integration: browser/Chrome-driven Dash integration tests; excluded from the default run and CI, run manually only",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tqdm", "tqdm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*", "dash", "dash.*"]
ignore_missing_imports = true


[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportUnknownMemberType = "none"
executionEnvironments = [
  { root = "." },
]
